[project]
name = "mobilesasa_integration"
authors = [{ name = "Mobile Sasa", email = "support@mobilesasa.com" }]
description = "Mobile Sasa SMS for Frappe / ERPNext: one-click SMS Settings, test send, balance"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Frappe Cloud reads this to decide which benches the app can install on.
# Tested on v15 (site install + native send E2E); nothing in the app uses
# APIs newer than that.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
